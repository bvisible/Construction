name: CI Full Suite

# Nightly full backend test run (unit + integration). The push gate in
# ci.yml runs the unit tree only because the integration tree against a
# service container does not fit the 60 minute job limit. This workflow
# gives the integration tree a real budget and can also be started by hand.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  backend-full:
    name: Backend Full Suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Run serially this job never finished. Every nightly since at least
    # 2026-07-22 ran for exactly 6h00m and was cancelled at the timeout-minutes
    # ceiling, so the step reported "cancelled" rather than a test result and
    # the whole tree produced no signal at all. 360 minutes is the GitHub-hosted
    # job limit, so there was no budget left to buy. pytest-split fans the
    # collected tree across eight matrix shards, each on its own runner with its
    # own throwaway PostgreSQL service, which removes the cross-shard database
    # contention as well. Same mechanism the push gate already uses for the unit
    # tree; eight rather than six because this tree is the unit tree plus the
    # integration, module and pg trees.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe
          POSTGRES_DB: openconstructionerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe -d openconstructionerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql+asyncpg://oe:oe@localhost:5432/openconstructionerp_test
          DATABASE_SYNC_URL: postgresql+psycopg2://oe:oe@localhost:5432/openconstructionerp_test
        # A per-test timeout so one hung test can no longer eat the whole
        # budget with the run cancelled and no signal of where it stalled - it
        # becomes a reported failure and the suite carries on. --durations and
        # -ra then make the slow spots and failures readable without scrolling
        # hours of Postgres logs. 900s is generous: no real unit or
        # integration test should approach 15 minutes. pytest-split partitions
        # the collected tree deterministically, so every test runs in exactly
        # one shard and the union of the eight shards is the whole tree.
        run: >-
          pytest -q -ra --durations=50 --timeout=900 --timeout-method=thread
          --splits 8 --group ${{ matrix.shard }}

  backend-full-gate:
    name: Backend Full Suite
    # One stable status check that is green only when every shard passed, so
    # the nightly still reads as a single pass/fail at a glance.
    needs: [backend-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to pass
        run: |
          if [ "${{ needs.backend-full.result }}" != "success" ]; then
            echo "Full-suite shards did not all pass: ${{ needs.backend-full.result }}"
            exit 1
          fi
          echo "All full-suite shards passed."

  backend-full-cross-os:
    name: Backend Full Suite (${{ matrix.os }}, embedded PG)
    # Nightly cross-OS deep run: the full backend suite on the embedded
    # PostgreSQL the desktop and self-hosted builds ship (pixeltable-pgserver,
    # no Docker), on the two OSes the Linux service-container job above cannot
    # cover. Nightly, so the heavier embedded-PG path has room and a red run is a
    # signal to fix rather than a merge blocker. This is where OS-specific
    # integration gaps (path handling, file locking, case sensitivity) surface.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        shell: bash
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite (embedded PostgreSQL)
        # No DATABASE_URL -> conftest boots the embedded pixeltable-pgserver
        # cluster. thread timeout method because signal/SIGALRM is Unix-only and
        # would break the Windows runner.
        run: pytest -q -ra --durations=50 --timeout=900 --timeout-method=thread
