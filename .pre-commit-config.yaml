# Pre-commit hooks for OpenEstimate
# Install: pip install pre-commit && pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key

  # Python linting & formatting. Pinned to the same ruff the CI gate and
  # backend/pyproject.toml dev extra use (ruff==0.15.20): the "ruff format
  # --check" gate compares against the formatter's exact output, so a hook on
  # an older ruff would reformat differently and fail CI on code that passed
  # locally. Bump this in lockstep with the pyproject pin.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks

  # Conventional commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, perf, ci, build, style]

  # Local hooks
  - repo: local
    hooks:
      # Catch backend/pyproject.toml ↔ frontend/package.json version drift.
      # History note: v1.3.32 → v1.4.2 silently shipped with backend stuck
      # on 1.3.31 because nothing was guarding the two literals.  Added in
      # v1.4.4 so the same gap can never sneak past a commit again.
      - id: version-sync-check
        name: Check backend/frontend version literals are in sync
        entry: python scripts/check_version_sync.py
        language: system
        pass_filenames: false
        files: ^(backend/pyproject\.toml|frontend/package\.json|CHANGELOG\.md|frontend/src/features/about/Changelog\.tsx)$

      # Block competitor/vendor brand names from entering the repo. Scans the
      # staged files only (so it guards new work without a full-tree pass), and
      # permits the small reviewed set of functional interop names in
      # scripts/brand_token_allowlist.txt. The check stores only token hashes,
      # so the denylist itself never names a brand.
      - id: brand-token-check
        name: Block competitor/vendor brand tokens
        entry: python scripts/check_no_brand_tokens.py
        language: system
        pass_filenames: true

      # Keep internal-only planning, strategy, QA, audit and runbook files out
      # of the repo. They are local only; this fails the commit if one is
      # staged. CI and the publish pipelines run the same script (against the
      # built wheel too) so a leak is caught at commit, CI and build time.
      - id: repo-hygiene-check
        name: Block internal-only files from the repo
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false

      # Forbid recording an AI assistant as a commit contributor. Runs at
      # commit-msg time on the message being written and rejects a
      # "Co-authored-by:" trailer or "Generated with ..." footer that names an
      # assistant; real human and bot co-authors are preserved. CI runs the same
      # script across history, so a trailer cannot land even if hooks are skipped.
      - id: commit-trailer-check
        name: Block AI attribution trailers in commit messages
        entry: python scripts/check_commit_trailers.py
        language: system
        stages: [commit-msg]

      # Catch doubled Unicode escapes in locale values (`\\u2013` where a
      # correct value has one backslash, `–`). A doubled backslash is
      # syntactically valid TypeScript, so tsc, the build and key-count
      # checks all stay green; it only shows as literal `–` garbage on
      # screen. Found and fixed 4 keys / 78 values across 28 locales
      # (a023d1e42, c452e3ecd); this guard is what stops a fifth instance
      # shipping unnoticed. CI runs the same script on every push.
      - id: locale-escape-check
        name: Block doubled Unicode escapes in locale files
        entry: python scripts/check_locale_escapes.py
        language: system
        pass_filenames: false
        files: ^frontend/src/app/locales/.*\.ts$

      # Scan the whole of en.ts for values byte-identical to their source in
      # 24+ of 28 non-en locales, and require every hit to land in exactly
      # one of two never-merged lists: i18n_leak_allowlist.json (identical on
      # purpose - abbreviations, standards codes, product names) or
      # i18n_leak_baseline.json (declared leak debt, an explicit key ->
      # leaked-locale set that may only shrink). Six commits on 2026-07-26
      # shipped 422 keys / 11360 cells this way - five under a message
      # claiming translation, one an ordinary feature commit that happened to
      # add keys along the way; every key existed and every coverage check
      # passed, so nothing caught it until #181 found the first one by hand.
      # This guard also rejects a "repair" that deletes a key instead of
      # translating it (fallbackLng=en still shows English either way), and
      # a small third list, i18n_leak_pending_review.json, holds the handful
      # of keys that don't cleanly fit either tell (e.g. a founder's name,
      # transliterated in two locales and left in Latin script everywhere
      # else) - reported every run, never gating. A second, complementary
      # detector catches what the count threshold structurally cannot: 3+
      # keys sharing one exact identical-locale set at ANY band, which found
      # two more incidents below the threshold (costExplorer, pipeline.*)
      # via coherence rather than count. It runs forward-only against
      # i18n_leak_cluster_snapshot.json, a frozen snapshot of already-seen
      # locale-set shapes, so it only fails on a genuinely new cluster
      # forming, not on retriaging ~2600 keys of ordinary per-locale
      # loanword coincidence every run. CI runs the same script.
      - id: i18n-leak-baseline-check
        name: Gate untracked byte-identical-to-en.ts locale values
        entry: python scripts/check_i18n_leak_baseline.py
        language: system
        pass_filenames: false
        files: ^(frontend/src/app/locales/.*\.ts|scripts/i18n_leak_(allowlist|baseline|pending_review|cluster_snapshot)\.json)$

      # Both guards above start from a key that exists. Neither can see a key
      # that is in no locale file at all: there is no value to read and none
      # to compare against, so `t(key, {defaultValue})` falls back and ships
      # the English default to all 29 languages with every gate green. #175
      # went out exactly that way - service.sla_breached and service.sla_late
      # became keys, no locale file ever got them, and the SLA chip read in
      # English everywhere through a full release. This resolves every such
      # call site against all 29 bundles (counting CLDR plural forms, without
      # which it reports 23 gaps where there are 13) and gates the rest
      # against i18n_orphan_baseline.json, a key -> missing-locale set that
      # may only shrink. CI runs the same script.
      - id: i18n-orphan-key-check
        name: Gate t() keys no locale file can answer
        entry: python scripts/check_i18n_orphan_keys.py
        language: system
        pass_filenames: false
        files: ^(frontend/src/.*\.tsx?|scripts/i18n_orphan_baseline\.json)$
